{% extends "base.html" %}
{% block content %}
<h2>Pilot Pack</h2>
<div class="card">
  <form method="get" action="/pack">
    <div class="row">
      <div>
        <label>data_version</label>
        <select name="dv" onchange="this.form.submit()">
          <option value="">-- выберите --</option>
          {% for dv in data_versions %}
            <option value="{{ dv }}" {% if dv==selected_dv %}selected{% endif %}>{{ dv }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </form>

  <form method="post" action="/pack/run" style="margin-top:12px;">
    <input type="hidden" name="data_version" value="{{ selected_dv }}" />
    <div class="row">
      <div>
        <label>qc_run</label>
        <select name="qc_run">
          {% for q in qc_runs %}<option value="{{ q }}">{{ q }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>model_version</label>
        <select name="model_version">
          {% for mv in model_versions %}<option value="{{ mv }}">{{ mv }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>scoring_run</label>
        <select name="scoring_run">
          {% for sr in scoring_runs %}<option value="{{ sr }}">{{ sr }}</option>{% endfor %}
        </select>
      </div>
      <div>
        <label>report_version</label>
        <select name="report_version">
          {% for rv in report_versions %}<option value="{{ rv }}">{{ rv }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <button class="primary" type="submit" {% if not selected_dv or user.role=='viewer' %}disabled{% endif %}>Собрать Pilot Pack</button>
    {% if user.role=='viewer' %}<span class="muted">Viewer не может собирать пакет</span>{% endif %}
  </form>
</div>

<div class="card">
  <h3>Где искать результат</h3>
  <div class="muted">После выполнения задачи pack смотрите лог и директорию: artifacts/&lt;dv&gt;/pilot_packs/...</div>
</div>
{% endblock %}

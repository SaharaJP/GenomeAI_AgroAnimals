version: 1
default_profile: legacy_replacement_ci
themes:
  daily_operations_parity:
    title: Daily operations parity
    summary: Governed daily-use queue, profile and mobile/cowside flows cover the
      formal replacement baseline for everyday herd execution.
    why_it_wins: GenomeAI keeps daily parity but adds linked facts, explainability
      and action surfaces instead of manual spreadsheet reconstruction.
    not_claimed:
    - Does not claim to replace every ERP or full HR scheduling function.
    - Does not claim zero-training rollout without governed onboarding.
    proof_points:
    - pp_daily_queue_profile
    - pp_mobile_cowside
    - pp_training_by_role
  explainable_ai:
    title: Explainable AI under governance
    summary: Embedded assistant, explainability by object and governed daily brief
      are fact-pack only and source-linked.
    why_it_wins: AI is used as triage and execution support, not as a freeform chat
      shell.
    not_claimed:
    - No hallucination mode or hidden autonomous decisions.
    - No invented model factors when source evidence is absent.
    proof_points:
    - pp_embedded_assistant
    - pp_explainability_by_object
    - pp_governed_daily_brief
  qc_governance:
    title: QC and governance
    summary: Product readiness is grounded in QC, rollout gates, audit trails and
      bounded external collaboration.
    why_it_wins: Replacement story is backed by formal evidence, not only by feature
      claims.
    not_claimed:
    - No unsupported cross-farm sharing or ad hoc per-page permissions.
    - No invisible write-actions outside audit-safe flows.
    proof_points:
    - pp_operational_gates
    - pp_external_collaboration
    - pp_competitive_acceptance
  economics_and_decisions:
    title: Economics and explainable action guidance
    summary: Users can inspect economics delta, linked actions and recalibration-ready
      feedback signals inside governed workflows.
    why_it_wins: Product shows action economics and feedback evidence inside the workflow
      instead of separate offline reasoning.
    not_claimed:
    - No hidden optimizer making decisions for the user.
    - No economics statements without linked facts and assumptions.
    proof_points:
    - pp_economics_per_action
    - pp_feedback_readiness
  migration_safety:
    title: Migration and replacement safety
    summary: Parallel run, migration verification, cutover playbook and acceptance
      evidence provide a bounded path away from legacy HMS.
    why_it_wins: Migration readiness is shown as governed evidence and rollback-aware
      playbooks, not as a big-bang promise.
    not_claimed:
    - No claim that every legacy export is auto-mapped without validation.
    - No claim that cutover should happen without verification evidence.
    proof_points:
    - pp_migration_verification
    - pp_parallel_run
    - pp_demo_benchmark
compare_checklists:
  pre_sales:
    title: Pre-sales compare checklist
    audience: pre-sales
    entries:
    - question: Can we show daily-use parity without slideware?
      proof_points:
      - pp_daily_queue_profile
      - pp_mobile_cowside
      - pp_demo_benchmark
    - question: Can we prove AI stays fact-linked and governed?
      proof_points:
      - pp_embedded_assistant
      - pp_governed_daily_brief
      - pp_explainability_by_object
    - question: Can we explain migration safety beyond marketing text?
      proof_points:
      - pp_migration_verification
      - pp_parallel_run
      - pp_competitive_acceptance
  uat:
    title: UAT compare checklist
    audience: uat
    entries:
    - question: Which parity scenarios are formally regression-ready?
      proof_points:
      - pp_competitive_acceptance
      - pp_operational_gates
    - question: Where are source-linked actions and caveats visible in workflow?
      proof_points:
      - pp_explainability_by_object
      - pp_economics_per_action
    - question: How is bounded collaboration controlled during pilot/UAT?
      proof_points:
      - pp_external_collaboration
      - pp_training_by_role
  implementation:
    title: Implementation compare checklist
    audience: implementation
    entries:
    - question: What supports safe onboarding and role ramp-up?
      proof_points:
      - pp_training_by_role
      - pp_demo_benchmark
    - question: What artifacts show rollout and diagnostics readiness?
      proof_points:
      - pp_operational_gates
      - pp_competitive_acceptance
      - pp_migration_verification

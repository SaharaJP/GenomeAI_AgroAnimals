# и связан с SLA в configs/workflow_v2/sla.yaml.
#
# Источник истины для UI: GET /api/app/v1/catalogs/domain-labels?locale=ru.
# Не дублировать эти подписи в frontend-bundle.

default_locale: ru

labels:

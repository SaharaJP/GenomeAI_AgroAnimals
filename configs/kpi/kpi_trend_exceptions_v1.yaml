# T10-02: Director dashboards 3.0 — trend exceptions rules
# Используется для выявления «исключений» в трендах (текущее окно vs предыдущее окно)
# Источник тренда (v1): dm_milkings_daily.csv (milk_kg)

# Сколько строк показывать/экспортировать (top by abs(change_pct), ALERT first)
top_n: 10

# Пороги по абсолютному изменению (%), например 0.10 = 10%
warn_change_pct: 0.05
alert_change_pct: 0.10

# Минимальное значение суммы в предыдущем окне, чтобы не делить на «почти ноль»
min_prev_sum: 1.0

# Окна (в днях) для сравнения «текущее» vs «предыдущее»
windows: [7, 30, 90]

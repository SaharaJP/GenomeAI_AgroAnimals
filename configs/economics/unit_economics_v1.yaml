schema: genomeai.unit_economics.v1

# Unit economics: распределение доходов/расходов pen-day на животных.
# Важно: это attribution/allocations, а не доказанная причинность.

allocation:
  # Как распределять pen-day стоимости (feed/other/vet/repro/cull) на животных.
  # Варианты:
  #   - milk_share: пропорционально milk_kg (по данным dm_milkings_daily)
  #   - headcount: поровну на животных, которые присутствуют в pen-day (по данным pen assignment)
  cost_method: milk_share

  # Минимум для деления, чтобы избежать 0/0
  eps_total: 1.0e-9

  # Если pen-day total_milk_kg == 0, то при milk_share cost_method:
  #   - в этом MVP (v1) распределение НЕ выполняем (cost_share=0)
  #   - позже можно включить headcount fallback.
  if_zero_total_milk: skip

  include_cost_components:
    feed: true
    other: true
    vet: true
    repro: true
    cull: true

ui:
  default_days_back: 30

limitations:
  - "Распределение (attribution) затрат/доходов по животным выполнено по упрощённым правилам (allocation.cost_method)."
  - "Если нет записи удоя в dm_milkings_daily за день, животное может не получить долю затрат (dry cows)."
  - "Это не доказанная причинность. Для ROI используйте контролируемые сравнения и качество данных." 

upstream genomeai_web_frontend {
  server web-frontend:3000;
}

upstream genomeai_backend_api {
  server backend-api:8000;
}

# ── HTTP ───────────────────────────────────────────────────────────────
# Only ACME http-01 challenge stays HTTP-served. Everything else
# redirects to HTTPS apex.
server {
  listen 80;
  server_name genomeai.ru www.genomeai.ru;

  # Let's Encrypt webroot challenge directory.
  # Bind-mount on host -> /var/www/acme inside nginx.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type "text/plain";
    access_log off;
  }

  location / {
    return 301 https://genomeai.ru$request_uri;
  }
}

# ── HTTPS: www -> apex 301 ────────────────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name www.genomeai.ru;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  return 301 https://genomeai.ru$request_uri;
}

# ── HTTPS: apex genomeai.ru — main app ────────────────────────────────
server {
  listen 443 ssl;
  http2 on;
  server_name genomeai.ru;

  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_stapling on;
  ssl_stapling_verify on;

  include /etc/nginx/security/security_headers.conf;

  location = /healthz {
    access_log off;
    proxy_pass http://genomeai_backend_api/healthz;
  }

  location = /readyz {
    access_log off;
    proxy_pass http://genomeai_backend_api/readyz;
  }

  # Next.js-owned API routes must go to web-frontend first
  location = /api/healthz {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }

  location = /api/readyz {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }

  location ^~ /api/auth/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }

  location ^~ /api/backend/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }

  location = /api/observability {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }

  location = /api/admin/permission-matrix {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }

  location ^~ /api/admin/ai/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }

  location ^~ /api/report-governance/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }

  location ^~ /api/uploads/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    client_max_body_size 50m;
    proxy_pass http://genomeai_web_frontend;
  }

  location ^~ /api/insights {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }

  location ^~ /api/qc/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }

  # Direct backend API
  location /api/ {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_backend_api;
  }

  location = /metrics/prometheus {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_backend_api/metrics/prometheus;
  }

  location /metrics {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_backend_api;
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
    proxy_pass http://genomeai_web_frontend;
  }
}

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: genomeai
  namespace: genomeai
spec:
  ingressClassName: nginx
  rules:
    - host: genomeai.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reverse-proxy
                port:
                  number: 80

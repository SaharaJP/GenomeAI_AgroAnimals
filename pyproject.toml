[project]
name = "genomeai"
version = "0.0.1"
description = "GenomeAI AgroAnimals offline-core scaffold"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "python-docx>=1.1",
  "reportlab>=4.0",
  "pypdf>=4.0",
  "openai>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
]


[project.scripts]
genomeai = "genomeai.cli:main"
genomeai-agroanimals = "genomeai.app_launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

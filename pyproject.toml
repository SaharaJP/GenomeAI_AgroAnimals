[project]
name = "genomeai"
version = "0.0.1"
description = "GenomeAI AgroAnimals offline-core scaffold"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "python-docx>=1.1",
  "reportlab>=4.0",
  "pypdf>=4.0",
  "openai>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "anthropic>=0.40",
  "redis>=5.0",
  "tiktoken>=0.7",
  "pydantic-settings>=2.0",
  "apscheduler>=3.10",
  "qrcode>=8.0",
  "alembic>=1.13",
  "pytz>=2024.1",
  "psycopg[binary]>=3.1",
  "psycopg2-binary>=2.9",
  "boto3>=1.34",
]


[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
genomeai = "genomeai.cli:main"
genomeai-agroanimals = "genomeai.app_launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
